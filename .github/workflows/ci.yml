name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Engine (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    name: Wasm build + app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # nightly + rust-src for the multithreaded build (build-std, +atomics)
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:wasm
      - run: pnpm build:wasm-mt
      - run: pnpm typecheck
      - run: pnpm --filter @panoloom/metadata test
      - run: pnpm --filter @panoloom/app build
      - name: Report wasm size
        run: ls -la packages/app/src/engine/pkg/*.wasm packages/app/src/engine/pkg-mt/*.wasm && gzip -k -9 packages/app/src/engine/pkg/panoloom_bg.wasm packages/app/src/engine/pkg-mt/panoloom_bg.wasm && ls -la packages/app/src/engine/pkg/*.gz packages/app/src/engine/pkg-mt/*.gz
