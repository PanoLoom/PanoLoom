# Deploys the app to Cloudflare Pages on pushes to main.
# Required repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# (create the Pages project once with: wrangler pages project create panoloom)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      # Every trigger for this workflow is meant to publish, so absent
      # credentials are a failure rather than something to skip past. This
      # previously skipped "cleanly", which meant main sat undeployed for
      # 11 days behind a green checkmark.
      - name: Require Cloudflare credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=
          [ -n "$TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Deploy is not configured — missing repo secret(s):$missing"
            exit 1
          fi

      - uses: actions/checkout@v4
      # nightly + rust-src for the multithreaded build (build-std, +atomics)
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/app/dist --project-name=panoloom

      # Proves the deploy landed. Reading a green Deploy as "the site is
      # current" is exactly the mistake this guards: the live site must
      # serve the bundle THIS run just built.
      - name: Verify the live site serves this build
        run: |
          asset=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' packages/app/dist/index.html | head -1)
          if [ -z "$asset" ]; then
            echo "::error::could not determine the built bundle name from dist/index.html"
            exit 1
          fi
          echo "expecting the live site to serve $asset"
          for _ in $(seq 1 20); do
            if curl -fsS https://panoloom.pages.dev/ | grep -q "$asset"; then
              echo "confirmed: panoloom.pages.dev serves $asset"
              exit 0
            fi
            sleep 15
          done
          echo "::error::panoloom.pages.dev is still not serving $asset after 5 minutes"
          exit 1
