[package]
name = "panoloom-wasm"
description = "wasm-bindgen bindings exposing the PanoLoom engine to the browser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Multithreaded build: rayon in the engine + a wasm-bindgen-rayon thread
# pool (requires nightly, build-std, +atomics; see build:wasm-mt).
mt = ["panoloom-core/parallel", "dep:wasm-bindgen-rayon"]

[dependencies]
panoloom-core = { path = "../panoloom-core", default-features = false }
serde_json = "1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-rayon = { version = "1.3", optional = true }
